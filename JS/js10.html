<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATE AND TIME</title>
</head>
<body>

    <div class="container">THis is our Webpage</div>
   

    <script>
        let now = new Date();
        console.log(now);

        let dt = new Date(100000);
        console.log(dt);


        // Date(year, month, date, minuites, seconds , milliseconds)
        // let newdate= new Date("2024-10-29");
        let newdate= new Date(2024, 9, 29, 2,3,4);
        console.log(newdate);



        newdate.setFullYear(2025);
        newdate.setDate(15);
        newdate.setMonth(0);
        newdate.setHours(12);
        newdate.setMinutes(23);
        newdate.setSeconds(27);


        let curYear= newdate.getFullYear();
        console.log("The required year is " + curYear);
       
        let curDate = newdate.getDate();
        console.log("req date is" +curDate);
       
        let curMonth = newdate.getMonth();
        console.log(curMonth);

        let curHour = newdate.getHours();
        console.log(curHour);

        let curMin = newdate.getMinutes();
        console.log(curMin);
       
        let curSeconds= newdate.getSeconds();
        console.log(curSeconds);
       
       

    </script>
</body>
</html>
